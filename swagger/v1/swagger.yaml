---
openapi: 3.0.1
info:
  title: Finance Tracker API
  version: v1
paths:
  "/api/v1/auth/register":
    post:
      summary: Registers a new user
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: user registered
        '422':
          description: invalid params
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/auth/login":
    post:
      summary: Logs in with email and password
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: logged in
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/auth/refresh":
    post:
      summary: Rotates a refresh token for a new token pair
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: token pair rotated
        '401':
          description: invalid refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/plaid/link_token":
    post:
      summary: Creates a Plaid Link token
      tags:
      - Plaid
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: link token created
        '401':
          description: missing or invalid token
  "/api/v1/plaid/exchange_public_token":
    post:
      summary: Exchanges a Plaid public_token and creates a bank_account
      tags:
      - Plaid
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: bank_account created
        '401':
          description: missing or invalid token
        '422':
          description: duplicate plaid_account_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                public_token:
                  type: string
                institution_name:
                  type: string
                account_id:
                  type: string
                mask:
                  type: string
              required:
              - public_token
              - institution_name
              - account_id
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
