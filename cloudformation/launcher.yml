AWSTemplateFormatVersion: "2010-09-09"

Description: >
  One-time infrastructure for the finance-tracker demo launcher (CLAUDE.md
  §13, "The orchestrator"). Unlike demo-stack.yml, this stack is deployed
  once by hand and left running - it's the thing that creates/extends/tears
  down demo-stack.yml's single shared instance, not something torn down
  itself between visits.

Parameters:
  PortfolioOrigin:
    Type: String
    Description: >
      Exact origin (scheme + host[:port]) of the portfolio website - the
      only origin the launcher's Function URL allows via CORS, e.g.
      http://your-site.s3-website-us-east-1.amazonaws.com

  DemoStackName:
    Type: String
    Default: finance-tracker-demo

  ExtendMinutes:
    Type: Number
    Default: 30
    Description: How far forward each visit pushes the teardown schedule.

Resources:
  # Holds demo-stack.yml so the Lambdas below can fetch and pass it as
  # CreateStack's TemplateBody themselves (TemplateURL was tried first and
  # observed to hang indefinitely - see get_template_body() below). Not
  # embedded directly in either Lambda - that would drift out of sync the
  # next time demo-stack.yml changes. Re-upload whenever that file changes:
  #   aws s3 cp cloudformation/demo-stack.yml s3://<this bucket's name>/demo-stack.yml
  DemoTemplateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub finance-tracker-demo-template-${AWS::AccountId}

  # Created once here, attached (never created/deleted) by demo-stack.yml
  # on every cycle - the AWS equivalent of EventTicketing's pre-made Azure
  # managed identity, which its VM template only attaches. A demo cycle
  # never creates or deletes an IAM identity.
  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDemoMasterKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                # Hardcoded, matching demo-stack.yml's own default for this
                # parameter name - this role has no visibility into whatever
                # RailsMasterKeyParameterName value a given demo-stack.yml
                # create-stack call actually used.
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finance-tracker/demo/rails_master_key

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: finance-tracker-demo-instance-profile
      Roles:
        - !Ref DemoInstanceRole

  # Tracks when the shared demo should next be torn down - CloudFormation
  # has no field for this. Plays the same role EventTicketing's own small
  # table does for its expiresAt: the launcher writes it on every POST, the
  # reconciler reads it to decide whether to create or delete the stack.
  DemoStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: finance-tracker-demo-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # Fronts the demo instance with a free, already-valid AWS-managed
  # certificate on CloudFront's own domain - no custom domain needed, no
  # Let's Encrypt, no per-boot certificate requests. Created once, like
  # everything else here; its origin gets repointed at whichever EC2
  # instance is currently running by LauncherFunction below, since a fresh
  # instance's hostname changes every demo cycle but this distribution's
  # own domain never does.
  DemoDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: finance-tracker demo - no custom domain, CloudFront's own cert
        PriceClass: PriceClass_100
        Origins:
          - Id: DemoOrigin
            # Placeholder - LauncherFunction repoints this at the real
            # instance's hostname once one exists. Never actually reached
            # while this placeholder is in place, since nothing resolves it
            # to anything running this app.
            DomainName: example.com
            CustomOriginConfig:
              # Matches demo-stack.yml's SG/Thruster port (8080, not 80 -
              # the container can't bind 80 as its non-root user under
              # --network host - and not 3000 either, which collides with
              # Puma's own default internal port).
              HTTPPort: 8080
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: DemoOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          # AWS managed "CachingDisabled" - this is a dynamic Rails app
          # with sessions/CSRF tokens, not static content; nothing here
          # should ever be cached.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AWS managed "AllViewer" - forwards all headers/cookies/query
          # strings to the origin, which Rails needs for sessions/CSRF.
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3

  # CloudFormation itself assumes this (via RoleARN, passed on every
  # CreateStack/DeleteStack call below) to actually provision demo-stack.yml's
  # resources, instead of continuing to use whichever Lambda invocation
  # triggered the call. Needed because a Lambda's own credentials are tied to
  # that one short invocation and don't remain valid for CloudFormation's
  # resource provisioning, which runs asynchronously and continues well after
  # the Lambda has already returned - observed directly as CreateStack
  # accepting the call (parameters resolved correctly, confirmed via
  # DescribeStacks) but then never creating a single resource, for 15+
  # minutes, specifically when called using the Lambda's own role instead of
  # a long-lived IAM user's credentials.
  DemoProvisioningRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-provisioning-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProvisionDemoStackResources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ec2:InstanceType: [t3.small, t3.medium, t3.large]
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:subnet/*
                  - arn:aws:ec2:*::image/*
              - Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeImages
                  - ec2:DescribeTags
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource:
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:vpc/*
              - Effect: Allow
                Action: ec2:AuthorizeSecurityGroupIngress
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                Condition:
                  StringLike:
                    "aws:ResourceTag/aws:cloudformation:stack-name": !Sub "${DemoStackName}*"
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Name: finance-tracker-demo
              - Effect: Allow
                Action: ec2:DeleteSecurityGroup
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                Condition:
                  StringLike:
                    "aws:ResourceTag/aws:cloudformation:stack-name": !Sub "${DemoStackName}*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt DemoInstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: arn:aws:ssm:*::parameter/aws/service/ami-amazon-linux-latest/*
              # demo-stack.yml's RailsMasterKeyParameterName is typed
              # AWS::SSM::Parameter::Name - CloudFormation itself calls
              # ssm:GetParameter to validate that parameter exists, using
              # whichever identity is actually provisioning the stack (this
              # role), not the EC2 instance's own role. Confirmed via
              # CloudTrail as the actual cause of CreateStack silently
              # retrying forever instead of failing cleanly: this role
              # never had this permission, only the human deploy user's own
              # policy did (from its separate one-time setup use), which is
              # why direct CLI create-stack always worked but this never did.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finance-tracker/demo/*

  # One shared role for both the public API Lambda and the reconciler
  # timer below - matching EventTicketing, where one managed identity
  # backs both the HTTP route and the timer trigger. Splitting these by
  # create-vs-delete stopped being sound once the public endpoint itself
  # can recover a failed deploy (DeleteStack) and the reconciler can also
  # redeploy after an expiry-driven delete (CreateStack): both paths need
  # the full lifecycle, not half of it each. Still a deliberate subset of
  # deploy-policy.json's permission set (CLAUDE.md §13) - human-debugging
  # actions (Session Manager, GetTemplate, DescribeStackEvents/Resources)
  # stay out, since neither Lambda ever needs them.
  DemoLifecycleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-lifecycle-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CreateDeleteDescribeDemoStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DemoStackName}*/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DemoTemplateBucket.Arn}/demo-stack.yml
              # Actually provisioning demo-stack.yml's resources (EC2,
              # security group, IAM PassRole to EC2, AMI resolve) is
              # DemoProvisioningRole's job now, assumed by CloudFormation
              # itself - this role only needs to hand that role over, not
              # hold those permissions directly.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt DemoProvisioningRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt DemoStateTable.Arn
              - Effect: Allow
                Action:
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${DemoDistribution}

  LauncherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: finance-tracker-demo-launcher
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DemoLifecycleRole.Arn
      Timeout: 30
      Environment:
        Variables:
          STACK_NAME: !Ref DemoStackName
          TEMPLATE_BUCKET: !Ref DemoTemplateBucket
          STATE_TABLE_NAME: !Ref DemoStateTable
          EXTEND_MINUTES: !Ref ExtendMinutes
          DISTRIBUTION_ID: !Ref DemoDistribution
          PUBLIC_URL: !Sub https://${DemoDistribution.DomainName}
          PROVISIONING_ROLE_ARN: !GetAtt DemoProvisioningRole.Arn
      Code:
        ZipFile: |
          import json
          import os
          import time
          import urllib.request

          import boto3
          import botocore

          cfn = boto3.client("cloudformation")
          dynamodb = boto3.client("dynamodb")
          cloudfront = boto3.client("cloudfront")
          s3 = boto3.client("s3")

          STACK_NAME = os.environ["STACK_NAME"]
          TEMPLATE_BUCKET = os.environ["TEMPLATE_BUCKET"]
          STATE_TABLE_NAME = os.environ["STATE_TABLE_NAME"]
          EXTEND_MINUTES = int(os.environ["EXTEND_MINUTES"])
          DISTRIBUTION_ID = os.environ["DISTRIBUTION_ID"]
          PUBLIC_URL = os.environ["PUBLIC_URL"]
          PROVISIONING_ROLE_ARN = os.environ["PROVISIONING_ROLE_ARN"]


          def handler(event, context):
              method = event["requestContext"]["http"]["method"]
              status, origin_hostname = describe_stack()

              if method == "POST":
                  expires_at = extend_expiry()
                  if status is None:
                      cfn.create_stack(StackName=STACK_NAME, TemplateBody=get_template_body(), Capabilities=["CAPABILITY_NAMED_IAM"], RoleARN=PROVISIONING_ROLE_ARN)
                      return respond("starting", expires_at)
                  if status == "ROLLBACK_COMPLETE":
                      cfn.delete_stack(StackName=STACK_NAME, RoleARN=PROVISIONING_ROLE_ARN)
                      return respond("starting", expires_at)
                  return respond(classify(status, origin_hostname), expires_at)

              # GET: read-only - never creates, deletes, or extends anything.
              return respond(classify(status, origin_hostname), get_expiry())


          def classify(status, origin_hostname):
              if status in (None, "ROLLBACK_COMPLETE", "DELETE_COMPLETE"):
                  return "stopped"
              if status == "CREATE_IN_PROGRESS":
                  return "starting"
              if status == "DELETE_IN_PROGRESS":
                  return "stopping"
              if status == "CREATE_COMPLETE":
                  sync_origin(origin_hostname)
                  return "ready" if is_healthy(PUBLIC_URL) else "starting"
              return "stopped"


          def get_template_body():
              # Not TemplateURL: CloudFormation's own fetch of a TemplateURL
              # pointing at this bucket was observed to hang indefinitely
              # (CREATE_IN_PROGRESS, zero resources, for 15+ minutes) in
              # testing - reading the object ourselves and passing its
              # content as TemplateBody avoids that path entirely.
              return s3.get_object(Bucket=TEMPLATE_BUCKET, Key="demo-stack.yml")["Body"].read().decode("utf-8")


          def sync_origin(origin_hostname):
              current = cloudfront.get_distribution_config(Id=DISTRIBUTION_ID)
              config = current["DistributionConfig"]
              origin = config["Origins"]["Items"][0]
              if origin["DomainName"] == origin_hostname:
                  return
              origin["DomainName"] = origin_hostname
              cloudfront.update_distribution(Id=DISTRIBUTION_ID, IfMatch=current["ETag"], DistributionConfig=config)


          def is_healthy(url):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      return 200 <= response.status < 400
              except Exception:
                  return False


          def describe_stack():
              try:
                  stacks = cfn.describe_stacks(StackName=STACK_NAME)["Stacks"]
              except botocore.exceptions.ClientError as error:
                  if "does not exist" in str(error):
                      return None, None
                  raise
              stack = stacks[0]
              outputs = {o["OutputKey"]: o["OutputValue"] for o in stack.get("Outputs", [])}
              return stack["StackStatus"], outputs.get("InstancePublicDnsName")


          def get_expiry():
              item = dynamodb.get_item(TableName=STATE_TABLE_NAME, Key={"pk": {"S": "demo"}}).get("Item")
              return item["expiresAt"]["S"] if item else None


          def extend_expiry():
              expires_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(time.time() + EXTEND_MINUTES * 60))
              dynamodb.put_item(TableName=STATE_TABLE_NAME, Item={"pk": {"S": "demo"}, "expiresAt": {"S": expires_at}})
              return expires_at


          def respond(state, expires_at=None):
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({"state": state, "url": PUBLIC_URL if state == "ready" else None, "expiresAt": expires_at}),
              }

  # Runs on a fixed timer, not a per-visit schedule - matches EventTicketing's
  # own 2-minute reconciliation loop. This is what actually deletes the
  # stack once DemoStateTable's expiresAt passes, and what redeploys it if
  # a POST pushed expiresAt back out while the old stack was still deleting
  # (nothing to delete by the time this runs, but still something to create).
  ReconcilerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: finance-tracker-demo-reconciler
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DemoLifecycleRole.Arn
      Timeout: 30
      Environment:
        Variables:
          STACK_NAME: !Ref DemoStackName
          TEMPLATE_BUCKET: !Ref DemoTemplateBucket
          STATE_TABLE_NAME: !Ref DemoStateTable
          PROVISIONING_ROLE_ARN: !GetAtt DemoProvisioningRole.Arn
      Code:
        ZipFile: |
          import os
          import time

          import boto3
          import botocore

          cfn = boto3.client("cloudformation")
          dynamodb = boto3.client("dynamodb")
          s3 = boto3.client("s3")

          STACK_NAME = os.environ["STACK_NAME"]
          TEMPLATE_BUCKET = os.environ["TEMPLATE_BUCKET"]
          STATE_TABLE_NAME = os.environ["STATE_TABLE_NAME"]
          PROVISIONING_ROLE_ARN = os.environ["PROVISIONING_ROLE_ARN"]


          def handler(event, context):
              status, _ = describe_stack()
              expires_at = get_expiry()
              now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              expired = expires_at is None or now >= expires_at

              if expired and status in ("CREATE_COMPLETE", "ROLLBACK_COMPLETE"):
                  cfn.delete_stack(StackName=STACK_NAME, RoleARN=PROVISIONING_ROLE_ARN)
              elif not expired and status in (None, "DELETE_COMPLETE"):
                  cfn.create_stack(StackName=STACK_NAME, TemplateBody=get_template_body(), Capabilities=["CAPABILITY_NAMED_IAM"], RoleARN=PROVISIONING_ROLE_ARN)
              # CREATE_IN_PROGRESS / DELETE_IN_PROGRESS: left for the next run.


          def describe_stack():
              try:
                  stacks = cfn.describe_stacks(StackName=STACK_NAME)["Stacks"]
              except botocore.exceptions.ClientError as error:
                  if "does not exist" in str(error):
                      return None, None
                  raise
              return stacks[0]["StackStatus"], None


          def get_template_body():
              return s3.get_object(Bucket=TEMPLATE_BUCKET, Key="demo-stack.yml")["Body"].read().decode("utf-8")


          def get_expiry():
              item = dynamodb.get_item(TableName=STATE_TABLE_NAME, Key={"pk": {"S": "demo"}}).get("Item")
              return item["expiresAt"]["S"] if item else None

  # Lets EventBridge Scheduler invoke the reconciler on our behalf - scoped
  # to exactly that one function, trusted only by the scheduler service.
  SchedulerInvocationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeReconcilerOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReconcilerFunction.Arn

  # Fixed cadence, declared once here rather than created/updated at
  # runtime - unlike the per-visit teardown this replaces, this schedule's
  # target time never changes, so no Lambda needs scheduler:CreateSchedule/
  # UpdateSchedule permissions anymore.
  ReconcilerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: finance-tracker-demo-reconciler
      ScheduleExpression: rate(2 minutes)
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReconcilerFunction.Arn
        RoleArn: !GetAtt SchedulerInvocationRole.Arn

  # Required whenever a Function URL's AuthType is NONE - without this,
  # public callers get an AccessDenied even though AuthType says "no auth".
  LauncherFunctionUrlPublicAccess:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LauncherFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # As of a late-2025 Lambda change, InvokeFunctionUrl above is no longer
  # sufficient by itself - public Function URL callers also need this
  # second statement granting lambda:InvokeFunction, scoped to only apply
  # when actually invoked via the Function URL (not some other path).
  LauncherFunctionUrlInvokeAccess:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LauncherFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  LauncherFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt LauncherFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: [!Ref PortfolioOrigin]
        AllowMethods: [GET, POST]
        MaxAge: 300

Outputs:
  LauncherUrl:
    Description: >
      Public endpoint the portfolio site calls. POST on page load (starts
      or extends); GET to poll afterward, read-only, every few seconds
      until state is "ready" with a url.
    Value: !GetAtt LauncherFunctionUrl.FunctionUrl

  DemoTemplateBucketName:
    Description: Re-upload demo-stack.yml here whenever it changes.
    Value: !Ref DemoTemplateBucket
