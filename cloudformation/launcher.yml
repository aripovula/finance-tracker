AWSTemplateFormatVersion: "2010-09-09"

Description: >
  One-time infrastructure for the finance-tracker demo launcher (CLAUDE.md
  §13, "The orchestrator"). Unlike demo-stack.yml, this stack is deployed
  once by hand and left running - it's the thing that creates/extends/tears
  down demo-stack.yml's single shared instance, not something torn down
  itself between visits.

Parameters:
  PortfolioOrigin:
    Type: String
    Description: >
      Exact origin (scheme + host[:port]) of the portfolio website - the
      only origin the launcher's Function URL allows via CORS, e.g.
      http://your-site.s3-website-us-east-1.amazonaws.com

  DemoStackName:
    Type: String
    Default: finance-tracker-demo

  ExtendMinutes:
    Type: Number
    Default: 30
    Description: How far forward each visit pushes the teardown schedule.

Resources:
  # Holds demo-stack.yml so CreateStack can reference it via TemplateURL
  # (the launcher Lambda doesn't embed a copy of that template - it would
  # drift out of sync the next time demo-stack.yml changes). Re-upload
  # whenever that file changes:
  #   aws s3 cp cloudformation/demo-stack.yml s3://<this bucket's name>/demo-stack.yml
  DemoTemplateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub finance-tracker-demo-template-${AWS::AccountId}

  # Created once here, attached (never created/deleted) by demo-stack.yml
  # on every cycle - the AWS equivalent of EventTicketing's pre-made Azure
  # managed identity, which its VM template only attaches. A demo cycle
  # never creates or deletes an IAM identity.
  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDemoMasterKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                # Hardcoded, matching demo-stack.yml's own default for this
                # parameter name - this role has no visibility into whatever
                # RailsMasterKeyParameterName value a given demo-stack.yml
                # create-stack call actually used.
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finance-tracker/demo/rails_master_key

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: finance-tracker-demo-instance-profile
      Roles:
        - !Ref DemoInstanceRole

  # Delete-only subset of deploy-policy.json's already-proven permission
  # set (see CLAUDE.md §13) - everything that policy grants for human
  # debugging (Session Manager, GetTemplate, DescribeStackEvents/Resources)
  # is left out, since this Lambda only ever calls DeleteStack.
  TeardownRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-teardown-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeleteDemoStackOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DemoStackName}*/*
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Name: finance-tracker-demo
              - Effect: Allow
                Action: ec2:DescribeSecurityGroups
                Resource: "*"
              - Effect: Allow
                Action: ec2:DeleteSecurityGroup
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                Condition:
                  StringLike:
                    "aws:ResourceTag/aws:cloudformation:stack-name": !Sub "${DemoStackName}*"
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                # Hardcoded, not ${DemoStackName}-instance-role: demo-stack.yml
                # itself hardcodes this exact name, unrelated to any stack-name
                # parameter it doesn't have - deriving it from DemoStackName here
                # would silently break if that parameter ever changed.
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/finance-tracker-demo-instance-role
              - Effect: Allow
                Action:
                  - iam:GetInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:DeleteInstanceProfile
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/finance-tracker-demo-instance-profile

  TeardownFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: finance-tracker-demo-teardown
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TeardownRole.Arn
      Timeout: 30
      Environment:
        Variables:
          STACK_NAME: !Ref DemoStackName
      Code:
        ZipFile: |
          import os

          import boto3

          cfn = boto3.client("cloudformation")
          STACK_NAME = os.environ["STACK_NAME"]


          def handler(event, context):
              cfn.delete_stack(StackName=STACK_NAME)

  # Lets EventBridge Scheduler invoke the teardown Lambda on our behalf -
  # scoped to exactly that one function, trusted only by the scheduler
  # service itself.
  SchedulerInvocationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeTeardownOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt TeardownFunction.Arn

  # Create-only subset of the same deploy-policy.json permission set (see
  # TeardownRole above), plus what only the launcher needs: reading the
  # template out of S3, and managing the one teardown schedule.
  LauncherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-launcher-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CreateAndDescribeDemoStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DemoStackName}*/*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${DemoTemplateBucket.Arn}/demo-stack.yml
              - Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ec2:InstanceType: [t3.small, t3.medium, t3.large]
              - Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:subnet/*
                  - arn:aws:ec2:*::image/*
              - Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:network-interface/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeImages
                  - ec2:DescribeTags
                Resource: "*"
              - Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource:
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:*:${AWS::AccountId}:vpc/*
              - Effect: Allow
                Action: ec2:AuthorizeSecurityGroupIngress
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                Condition:
                  StringLike:
                    "aws:ResourceTag/aws:cloudformation:stack-name": !Sub "${DemoStackName}*"
              # Hardcoded, not ${DemoStackName}-instance-role: see the same
              # note on TeardownRole above - demo-stack.yml's RoleName and
              # InstanceProfileName are fixed strings, not parameterized.
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:AttachRolePolicy
                  - iam:PutRolePolicy
                  - iam:TagRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/finance-tracker-demo-instance-role
              - Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:TagInstanceProfile
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/finance-tracker-demo-instance-profile
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/finance-tracker-demo-instance-role
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: arn:aws:ssm:*::parameter/aws/service/ami-amazon-linux-latest/*
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:GetSchedule
                Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/finance-tracker-demo-teardown
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SchedulerInvocationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  LauncherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: finance-tracker-demo-launcher
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LauncherRole.Arn
      Timeout: 30
      Environment:
        Variables:
          STACK_NAME: !Ref DemoStackName
          TEMPLATE_URL: !Sub https://${DemoTemplateBucket}.s3.${AWS::Region}.amazonaws.com/demo-stack.yml
          SCHEDULE_NAME: finance-tracker-demo-teardown
          SCHEDULE_GROUP: default
          TEARDOWN_FUNCTION_ARN: !GetAtt TeardownFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvocationRole.Arn
          EXTEND_MINUTES: !Ref ExtendMinutes
      Code:
        ZipFile: |
          import json
          import os
          import time

          import boto3
          import botocore

          cfn = boto3.client("cloudformation")
          scheduler = boto3.client("scheduler")

          STACK_NAME = os.environ["STACK_NAME"]
          TEMPLATE_URL = os.environ["TEMPLATE_URL"]
          SCHEDULE_NAME = os.environ["SCHEDULE_NAME"]
          SCHEDULE_GROUP = os.environ["SCHEDULE_GROUP"]
          TEARDOWN_FUNCTION_ARN = os.environ["TEARDOWN_FUNCTION_ARN"]
          SCHEDULER_ROLE_ARN = os.environ["SCHEDULER_ROLE_ARN"]
          EXTEND_MINUTES = int(os.environ["EXTEND_MINUTES"])


          def handler(event, context):
              status, url = describe_stack()

              if status is None:
                  cfn.create_stack(
                      StackName=STACK_NAME,
                      TemplateURL=TEMPLATE_URL,
                      Capabilities=["CAPABILITY_NAMED_IAM"],
                  )
                  return respond("starting")

              if status == "ROLLBACK_COMPLETE":
                  cfn.delete_stack(StackName=STACK_NAME)
                  return respond("restarting")

              if status == "CREATE_COMPLETE":
                  extend_teardown()
                  return respond("ready", url)

              if status == "CREATE_IN_PROGRESS":
                  return respond("starting")

              if status == "DELETE_IN_PROGRESS":
                  return respond("restarting")

              return respond(status.lower())


          def describe_stack():
              try:
                  stacks = cfn.describe_stacks(StackName=STACK_NAME)["Stacks"]
              except botocore.exceptions.ClientError as error:
                  if "does not exist" in str(error):
                      return None, None
                  raise
              stack = stacks[0]
              outputs = {o["OutputKey"]: o["OutputValue"] for o in stack.get("Outputs", [])}
              return stack["StackStatus"], outputs.get("DemoURL")


          def extend_teardown():
              run_at = time.strftime("%Y-%m-%dT%H:%M:%S", time.gmtime(time.time() + EXTEND_MINUTES * 60))
              kwargs = {
                  "Name": SCHEDULE_NAME,
                  "GroupName": SCHEDULE_GROUP,
                  "ScheduleExpression": f"at({run_at})",
                  "FlexibleTimeWindow": {"Mode": "OFF"},
                  "ActionAfterCompletion": "DELETE",
                  "Target": {"Arn": TEARDOWN_FUNCTION_ARN, "RoleArn": SCHEDULER_ROLE_ARN},
              }
              try:
                  scheduler.update_schedule(**kwargs)
              except scheduler.exceptions.ResourceNotFoundException:
                  scheduler.create_schedule(**kwargs)


          def respond(status, url=None):
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({"status": status, "url": url}),
              }

  # Required whenever a Function URL's AuthType is NONE - without this,
  # public callers get an AccessDenied even though AuthType says "no auth".
  LauncherFunctionUrlPublicAccess:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LauncherFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  LauncherFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt LauncherFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: [!Ref PortfolioOrigin]
        AllowMethods: [GET]
        MaxAge: 300

Outputs:
  LauncherUrl:
    Description: >
      Public endpoint the portfolio site calls on page load, and polls
      every few seconds afterward until it gets back a "ready" status with
      a url.
    Value: !GetAtt LauncherFunctionUrl.FunctionUrl

  DemoTemplateBucketName:
    Description: Re-upload demo-stack.yml here whenever it changes.
    Value: !Ref DemoTemplateBucket
