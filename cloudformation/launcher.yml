AWSTemplateFormatVersion: "2010-09-09"

Description: >
  One-time infrastructure for the finance-tracker demo launcher (CLAUDE.md
  §13, "The orchestrator"). Unlike demo-stack.yml, this stack is deployed
  once by hand and left running - it's the thing that creates/extends/tears
  down demo-stack.yml's single shared instance, not something torn down
  itself between visits.

Parameters:
  PortfolioOrigin:
    Type: String
    Description: >
      Exact origin (scheme + host[:port]) of the portfolio website - the
      only origin the launcher's Function URL allows via CORS, e.g.
      http://your-site.s3-website-us-east-1.amazonaws.com

  DemoStackName:
    Type: String
    Default: finance-tracker-demo

  ExtendMinutes:
    Type: Number
    Default: 30
    Description: How far forward each visit pushes the teardown schedule.

Resources:
  # Holds demo-stack.yml so CreateStack can reference it via TemplateURL
  # (the launcher Lambda doesn't embed a copy of that template - it would
  # drift out of sync the next time demo-stack.yml changes). Re-upload
  # whenever that file changes:
  #   aws s3 cp cloudformation/demo-stack.yml s3://<this bucket's name>/demo-stack.yml
  DemoTemplateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub finance-tracker-demo-template-${AWS::AccountId}

  # Delete-only subset of deploy-policy.json's already-proven permission
  # set (see CLAUDE.md §13) - everything that policy grants for human
  # debugging (Session Manager, GetTemplate, DescribeStackEvents/Resources)
  # is left out, since this Lambda only ever calls DeleteStack.
  TeardownRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: finance-tracker-demo-teardown-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeleteDemoStackOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DemoStackName}*/*
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Name: finance-tracker-demo
              - Effect: Allow
                Action: ec2:DescribeSecurityGroups
                Resource: "*"
              - Effect: Allow
                Action: ec2:DeleteSecurityGroup
                Resource: !Sub arn:aws:ec2:*:${AWS::AccountId}:security-group/*
                Condition:
                  StringLike:
                    "aws:ResourceTag/aws:cloudformation:stack-name": !Sub "${DemoStackName}*"
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                # Hardcoded, not ${DemoStackName}-instance-role: demo-stack.yml
                # itself hardcodes this exact name, unrelated to any stack-name
                # parameter it doesn't have - deriving it from DemoStackName here
                # would silently break if that parameter ever changed.
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/finance-tracker-demo-instance-role
              - Effect: Allow
                Action:
                  - iam:GetInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:DeleteInstanceProfile
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/finance-tracker-demo-instance-profile

  TeardownFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: finance-tracker-demo-teardown
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TeardownRole.Arn
      Timeout: 30
      Environment:
        Variables:
          STACK_NAME: !Ref DemoStackName
      Code:
        ZipFile: |
          import os

          import boto3

          cfn = boto3.client("cloudformation")
          STACK_NAME = os.environ["STACK_NAME"]


          def handler(event, context):
              cfn.delete_stack(StackName=STACK_NAME)
