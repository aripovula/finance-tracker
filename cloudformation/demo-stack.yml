AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Ephemeral demo deployment for finance-tracker (see CLAUDE.md §13). A
  single EC2 instance runs Postgres, Redis-compatible Valkey, and Kafka
  natively - the same "no Docker, everything via asdf" approach local dev
  uses for infra (CLAUDE.md §6, §8) - while the Rails app and Karafka
  consumers run as containers pulled from a prebuilt image (DemoImage
  below), to avoid compiling Ruby and bundling gems on every boot. No
  RDS/ElastiCache/MSK/ECS - those take too long to provision for a
  30-minute on-demand demo window.
  This stack is meant to be created by an external orchestrator (the
  portfolio website, not yet built) and deleted again ~30 minutes later.
  It has no auto-teardown of its own beyond the safety-net instance
  shutdown below - the 30-minute policy is intentionally owned by that
  orchestrator, not duplicated here, since it's shared across every
  trio app's stack.

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: >
      t3.medium is the default rather than t3.small purely for a faster
      first boot - compiling Ruby 3.4 from source via asdf is CPU-bound and
      meaningfully faster with more vCPUs. The cost difference between
      instance sizes over a ~30-minute run is a few cents either way, so
      it isn't worth optimizing for here the way it would be for a
      24/7 instance.

  RailsMasterKeyParameterName:
    Type: AWS::SSM::Parameter::Name
    Default: /finance-tracker/demo/rails_master_key
    Description: >
      Name of a SecureString SSM parameter holding the exact contents of
      this app's config/master.key, created ahead of time and out of band
      (e.g. `aws ssm put-parameter --type SecureString --name
      /finance-tracker/demo/rails_master_key --value "$(cat
      config/master.key)"`). This template only grants read access to it
      by name - it never contains the secret itself, and the secret is
      never committed to this repo.

  DemoImage:
    Type: String
    Default: ghcr.io/aripovula/finance-tracker:latest
    Description: >
      Prebuilt image, built and pushed by .github/workflows/release.yml on
      every push to main - the instance pulls and runs this instead of
      cloning the repo and compiling Ruby/bundling gems at boot, the same
      way EventTicketing's cloud-init downloads a prebuilt release tarball
      instead of building from source.

  DemoInstanceProfileName:
    Type: String
    Default: finance-tracker-demo-instance-profile
    Description: >
      Name of the instance profile created once by launcher.yml (CLAUDE.md
      §13) - this template only attaches it by name, the same way
      EventTicketing's Azure VM template only attaches a pre-made managed
      identity. A demo cycle never creates or deletes an IAM identity.

  SafetyNetShutdownMinutes:
    Type: Number
    Default: 35
    Description: >
      Fallback self-shutdown scheduled on the instance itself, in case the
      external 30-minute teardown (CLAUDE.md §13, owned by the portfolio
      website) doesn't run for some reason - e.g. its Lambda errors, or the
      stack gets created directly for testing without that orchestrator in
      the loop at all. Intentionally a few minutes after the expected
      30-minute teardown, not the primary mechanism - shutting the
      instance down isn't the same as deleting the stack, but it stops the
      meter and is a cheap, simple backstop.

Resources:
  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Explicit, predictable names on this group, the role, and the
      # instance profile below (rather than letting CloudFormation
      # auto-generate random-suffixed ones) so a deploying IAM policy can
      # scope itself to exactly these resources by ARN, instead of needing
      # a wildcard across every security group/role/profile in the account.
      GroupName: finance-tracker-demo-sg
      # AWS restricts security group descriptions to under 256 characters,
      # from a limited character set that excludes apostrophes - both
      # constraints are easy to miss until CloudFormation rejects it. The
      # `>-` (not plain `>`) strips the trailing newline a folded block
      # scalar otherwise appends, which EC2 also rejects as an invalid
      # character even though it's invisible in the YAML source.
      GroupDescription: >-
        finance-tracker demo - HTTP app port only. No SSH: short-lived
        public demo box, so port 22 is not opened, to shrink attack
        surface. Use EC2 Instance Connect or Session Manager
        (AmazonSSMManagedInstanceCore) for shell access if needed.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
          # Thruster's default (HTTP_PORT=80) needs CAP_NET_BIND_SERVICE to
          # bind a privileged port as the container's non-root user, which
          # doesn't reliably carry over under --network host - observed
          # directly as "listen tcp :80: bind: permission denied" in a real
          # boot. HTTP_PORT=3000 (set on the container below) sidesteps the
          # privileged-port rule entirely rather than fighting capabilities.
          Description: Public access to the Rails app (Thruster, inside the prebuilt container, listens on 3000 and proxies to Puma internally)

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      # Always the current Amazon Linux 2023 AMI - no AMI ID to keep updated by hand.
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      IamInstanceProfile: !Ref DemoInstanceProfileName
      SecurityGroupIds:
        - !Ref DemoSecurityGroup
      Tags:
        - Key: Name
          Value: finance-tracker-demo
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex
          exec > /var/log/demo-bootstrap.log 2>&1

          # Safety net only - see SafetyNetShutdownMinutes above. The real
          # teardown is CloudFormation's DeleteStack, triggered externally.
          shutdown -h +${SafetyNetShutdownMinutes} || true

          dnf update -y
          dnf install -y git docker postgresql15-server postgresql15 valkey
          # AWS CLI v2 ships preinstalled on the AL2023 AMI - not dnf-installed
          # here, since that package name has changed across AL2023 releases
          # and a wrong one would abort this whole script under `set -e`.
          systemctl enable --now docker

          # --- Postgres ---------------------------------------------------
          postgresql-setup --initdb
          PGDATA=/var/lib/pgsql/data
          systemctl enable --now postgresql

          # Create the role first, while the default pg_hba.conf (ident/peer)
          # still applies - that's what lets `sudo -u postgres psql` connect
          # passwordlessly here, since the OS user "postgres" matches the DB
          # role "postgres" under peer auth. database.yml has no `host:` set,
          # so the pg gem connects via this same local Unix socket, not TCP -
          # only AFTER this role exists do we lock the socket down to
          # password auth below, or there'd be no password yet to check.
          DB_PASSWORD=$(openssl rand -hex 16)
          # SUPERUSER, not least-privilege, is a deliberate simplification:
          # this role only ever exists for this one ephemeral box's
          # lifetime, with no other tenants or data to protect it from.
          sudo -u postgres psql -c "CREATE ROLE finance_tracker WITH LOGIN SUPERUSER PASSWORD '$DB_PASSWORD';"

          # Now switch local+host auth to password-based: Rails connects as
          # role "finance_tracker" from OS user "demo", which peer auth
          # (matching OS username to role name) would never allow. Scram is
          # Postgres 15's modern default password auth method.
          sed -i 's/ident/scram-sha-256/g; s/peer/scram-sha-256/g' "$PGDATA/pg_hba.conf"
          systemctl reload postgresql

          # --- Redis-compatible (AL2023 ships Valkey, not redis) ----------
          systemctl enable --now valkey

          # --- App env file -------------------------------------------------
          useradd -m demo
          RAILS_MASTER_KEY=$(aws ssm get-parameter --name "${RailsMasterKeyParameterName}" --with-decryption --query Parameter.Value --output text --region ${AWS::Region})
          # Deliberately no DATABASE_URL: this app's database.yml defines
          # four distinct databases for production (primary/cache/queue/
          # cable, Rails 8's Solid Queue/Cache/Cable defaults), each with
          # its own database name, via FINANCE_TRACKER_DATABASE_PASSWORD.
          # Rails' DATABASE_URL auto-merge is built around a single
          # database and its interaction with that multi-db setup isn't
          # something to rely on without testing it directly.
          cat > /etc/finance-tracker.env <<ENV
          RAILS_ENV=production
          RAILS_MASTER_KEY=$RAILS_MASTER_KEY
          FINANCE_TRACKER_DATABASE_PASSWORD=$DB_PASSWORD
          REDIS_URL=redis://localhost:6379/0
          ENV
          chmod 600 /etc/finance-tracker.env

          # --- Kafka's own runtime (broker infra, not app code - stays
          # native on the host the same way Postgres/Valkey do, outside the
          # prebuilt image). Only the two files bin/kafka actually needs are
          # fetched directly - no full checkout anymore. ---------------------
          mkdir -p /home/demo/kafka-runtime/bin /home/demo/kafka-runtime/config/kafka /home/demo/kafka-runtime/tmp/kafka-logs
          curl -fsSL "https://raw.githubusercontent.com/aripovula/finance-tracker/main/bin/kafka" -o /home/demo/kafka-runtime/bin/kafka
          curl -fsSL "https://raw.githubusercontent.com/aripovula/finance-tracker/main/config/kafka/server.properties" -o /home/demo/kafka-runtime/config/kafka/server.properties
          chmod +x /home/demo/kafka-runtime/bin/kafka
          chown -R demo:demo /home/demo/kafka-runtime

          sudo -iu demo bash <<'SETUP'
          set -ex

          # Modern asdf (0.16+) is a single Go binary, not the older
          # shell-script framework - no asdf.sh to source, just a binary
          # plus shims on PATH.
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/asdf-vm/asdf/releases/download/v0.20.0/asdf-v0.20.0-linux-amd64.tar.gz" | tar -xz -C "$HOME/bin"
          export ASDF_DATA_DIR="$HOME/.asdf"
          export PATH="$HOME/bin:$ASDF_DATA_DIR/shims:$PATH"
          echo 'export ASDF_DATA_DIR="$HOME/.asdf"' >> ~/.bashrc
          echo 'export PATH="$HOME/bin:$ASDF_DATA_DIR/shims:$PATH"' >> ~/.bashrc

          # Only Kafka (and the Java it runs on) installs via asdf now -
          # Ruby no longer needs to exist on this host at all, since the app
          # runs inside DemoImage instead. No repo checkout to read pinned
          # versions from anymore, so these mirror this repo's own
          # .tool-versions directly and pin globally.
          asdf plugin add java
          asdf plugin add kafka
          asdf install java temurin-21.0.12+8.0.LTS
          asdf install kafka apache-4.1.2
          asdf set -u java temurin-21.0.12+8.0.LTS
          asdf set -u kafka apache-4.1.2
          SETUP

          # --- Kafka process supervision (systemd, not nohup) - the only
          # thing left that needs it, now that Rails/Karafka run as
          # Docker-supervised containers below. ------------------------------
          cat > /home/demo/bin/start-kafka.sh <<'WRAP'
          #!/bin/bash
          export HOME=/home/demo
          export ASDF_DATA_DIR="$HOME/.asdf"
          export PATH="$HOME/bin:$ASDF_DATA_DIR/shims:$PATH"
          exec /home/demo/kafka-runtime/bin/kafka
          WRAP
          chmod +x /home/demo/bin/start-kafka.sh
          chown demo:demo /home/demo/bin/start-kafka.sh

          cat > /etc/systemd/system/demo-kafka.service <<'UNIT'
          [Unit]
          Description=finance-tracker demo - Kafka

          [Service]
          Type=simple
          User=demo
          ExecStart=/home/demo/bin/start-kafka.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now demo-kafka

          # --- App + consumers, as prebuilt containers (Docker's own
          # --restart policy supervises these, the role systemd plays for
          # Kafka above). --network host covers Valkey/Kafka on localhost,
          # but Postgres connects over a Unix socket (database.yml sets no
          # host, so the pg gem defaults to one) - sockets are filesystem
          # paths, not network, so --network host alone doesn't expose it;
          # bind-mounting the host's socket directory does.
          docker run --rm --network host -v /run/postgresql:/run/postgresql --env-file /etc/finance-tracker.env "${DemoImage}" bin/rails db:create db:schema:load db:seed

          docker run -d --name finance-tracker-rails --network host --restart unless-stopped \
            -v /run/postgresql:/run/postgresql -e HTTP_PORT=3000 --env-file /etc/finance-tracker.env "${DemoImage}"

          docker run -d --name finance-tracker-karafka --network host --restart unless-stopped \
            -v /run/postgresql:/run/postgresql --env-file /etc/finance-tracker.env "${DemoImage}" bundle exec karafka server

Outputs:
  DemoURL:
    Description: >
      Direct URL for the demo (Thruster, inside the prebuilt container, on
      :3000), bypassing CloudFront - for debugging. Visitors get the
      launcher's own stable CloudFront URL instead (CLAUDE.md §13), which
      stays the same across every demo cycle even though this one doesn't.
    Value: !Sub http://${DemoInstance.PublicDnsName}:3000

  InstancePublicDnsName:
    Description: >
      Just the hostname (no scheme) - what launcher.yml's LauncherFunction
      reads to keep its CloudFront distribution's origin pointed at
      whichever instance is actually running.
    Value: !GetAtt DemoInstance.PublicDnsName

  InstanceId:
    Value: !Ref DemoInstance
